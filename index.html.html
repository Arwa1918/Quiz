<p data-b="Answer 14 quick questions. Six are just for fun. Your results appear the moment you finish, and nothing is saved or sent anywhere.|14 مختصر سوالات کے جواب دیں۔ چھ صرف تفریح کے لیے ہیں۔ ختم کرتے ہی نتیجہ سامنے آ جائے گا، اور کچھ بھی محفوظ یا کہیں بھیجا نہیں جاتا۔"></p>
<p style="margin-bottom:26px" data-b="Pick the answer that feels most like you, even if two seem close.|وہ جواب چنیں جو آپ سے سب سے زیادہ ملتا ہو، چاہے دو جواب قریب لگیں۔"></p>

<div class="note" data-b="This is a fun self-reflection tool, not a scientific test. Most people use all three ways, and the best way depends on the task. Research has not shown that teaching to one style improves results, so use your result to start a conversation, not to label yourself or your students. Aim for something to see, something to say and something to do in every lesson.|یہ خود شناسی کا ایک تفریحی ذریعہ ہے، سائنسی ٹیسٹ نہیں۔ زیادہ تر لوگ تینوں طریقے استعمال کرتے ہیں، اور بہترین طریقہ کام پر منحصر ہوتا ہے۔ تحقیق سے یہ ثابت نہیں ہوا کہ کسی ایک انداز پر پڑھانے سے نتائج بہتر ہوتے ہیں، اس لیے اپنے نتیجے کو بات چیت کے آغاز کے لیے استعمال کریں، خود کو یا طلبہ کو لیبل دینے کے لیے نہیں۔ ہر سبق میں کچھ دیکھنے، کچھ کہنے اور کچھ کرنے کے لیے رکھیں۔"></div>

 "ہمہ جہت سیکھنے والا","آپ دیکھنے، سننے اور حرکت کو تقریباً برابر استعمال کرتے ہیں۔ یہ لچک تدریس کے لیے نعمت ہے، کیونکہ آپ بہت سے طلبہ تک پہنچ سکتے ہیں۔",["ہر سبق میں دیکھنے، کہنے اور کرنے کی کوئی چیز رکھیں","اسٹیشنز گھمائیں: دیکھو، کہو، کرو","طلبہ کو سیکھنا دکھانے کا اختیار دیں","دیکھیں کہ ہر طالب علم کا جھکاؤ کس طرف ہے"]]};
var $=function(i){return document.getElementById(i)};
var B=function(e,u){return '<span class="en">'+e+'</span><span class="ur" lang="ur" dir="rtl">'+u+'</span>'};
var ans=[],cur=0,orders=[];
document.querySelectorAll("[data-b]").forEach(function(el){var p=el.getAttribute("data-b").split("|");el.innerHTML=B(p[0],p[1])});
document.querySelectorAll(".lang button").forEach(function(b){b.onclick=function(){document.body.setAttribute("data-lang",b.dataset.l);document.querySelectorAll(".lang button").forEach(function(x){x.setAttribute("aria-pressed",x===b?"true":"false")})}});
function show(id){["start","quiz","result"].forEach(function(s){$(s).hidden=s!==id});window.scrollTo(0,0)}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
function render(){
 var q=QS[cur],u=QU[cur],n=QS.length;$("count").innerHTML=B("Question "+(cur+1)+" of "+n,"سوال "+(cur+1)+" از "+n);$("fun").hidden=!q[1];
 $("prog").style.width=(cur/n*100)+"%";$("qtext").innerHTML=B(q[0],u[0]);
 if(!orders[cur])orders[cur]=shuffle(["V","A","K"]);
 var box=$("opts");box.innerHTML="";
 orders[cur].forEach(function(t){var i={V:2,A:3,K:4}[t],b=document.createElement("button");b.className="opt"+(ans[cur]===t?" on":"");b.innerHTML=B(q[i],u[i-1]);
  b.onclick=function(){ans[cur]=t;b.className="opt on";setTimeout(next,matchMedia("(prefers-reduced-motion:reduce)").matches?0:300)};box.appendChild(b)});
 $("back").hidden=cur===0;
}
function next(){if(cur<QS.length-1){cur++;render()}else finish()}
function finish(){
 var s={V:0,A:0,K:0};ans.forEach(function(t){s[t]++});var n=QS.length,max=Math.max(s.V,s.A,s.K);
 var top=["V","A","K"].filter(function(k){return max-s[k]<=1}).join("");
 var f=INFO[top.length===3?"VAK":top];
 $("emoji").textContent=top.length===3?"🌈":top.split("").map(function(k){return T[k].e}).join(" ");
 $("persona").innerHTML=B(f[0],f[3]);$("blurb").innerHTML=B(f[1],f[4]);
 $("tips").innerHTML=f[2].map(function(t,i){return"<li>"+B(t,f[5][i])+"</li>"}).join("");
 var ch=$("chart");ch.innerHTML="";var te=[],tu=[];
 ["V","A","K"].forEach(function(k){var p=Math.round(s[k]/n*100);te.push(T[k].n+" "+p+"%");tu.push(T[k].u+" "+p+"%");
  var r=document.createElement("div");r.className="row";r.innerHTML='<span>'+B(T[k].n,T[k].u)+'</span><div class="track"><b style="background:'+T[k].c+'"></b></div><em>'+p+'%</em>';ch.appendChild(r);
  setTimeout(function(){r.querySelector("b").style.width=p+"%"},60)});
 window.RES="I took the learning preference quiz. I'm "+f[0]+": "+te.join(", ")+".\nمیں نے سیکھنے کے انداز کا کوئز دیا۔ میں ہوں "+f[3]+": "+tu.join("، ")+"۔";
 $("toast").textContent="";show("result");
}
$("go").onclick=function(){ans=[];orders=[];cur=0;show("quiz");render()};
$("back").onclick=function(){if(cur>0){cur--;render()}};
$("again").onclick=function(){show("start")};
$("copy").onclick=function(){
 var done=function(){$("toast").innerHTML=B("Copied. Paste it into your group chat.","کاپی ہو گیا۔ اپنے گروپ چیٹ میں پیسٹ کریں۔")};
 var fb=function(){$("toast").innerHTML=B("Copying is blocked here. Select and copy this text:","یہاں کاپی کرنا بلاک ہے۔ یہ متن منتخب کر کے کاپی کریں:")+"<textarea readonly rows=4></textarea>";var ta=$("toast").querySelector("textarea");ta.value=window.RES;ta.select()};
 try{navigator.clipboard.writeText(window.RES).then(done,fb)}catch(e){fb()}
};
</script></body></html>
